<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LMU Pace Checker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:900px;margin:40px auto;padding:24px;background:#080808;border:1px solid #222;border-radius:18px}
h1{font-size:26px;margin:0 0 5px}.muted{color:#888}
input,button{font:inherit}input{width:100%;padding:13px 14px;background:#111;color:#eee;border:1px solid #333;border-radius:10px;outline:0}
button{cursor:pointer}.tracks{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:430px;overflow:auto;margin-top:12px}
.track{padding:11px 13px;text-align:left;background:#101010;color:#ddd;border:1px solid #292929;border-radius:9px}.track:hover{border-color:#777;background:#171717}
.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}
.back{background:#151515;color:#eee;border:1px solid #333;border-radius:9px;padding:10px 14px}
.map{height:330px;margin:18px 0;background:#050505;border:1px solid #222;border-radius:14px;display:flex;align-items:center;justify-content:center}
.map svg{width:90%;height:90%}.trackLogo{width:68%;max-width:420px;height:auto;object-fit:contain}.outline{fill:none;stroke:#ddd;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.row{display:grid;grid-template-columns:1fr 170px;gap:10px}.check{background:#eee;color:#080808;border:0;border-radius:10px;font-weight:800}
.result{margin-top:18px;padding:20px;border:1px solid #292929;border-radius:14px;background:#0d0d0d}
.pace{font-size:38px;font-weight:900;margin:4px 0}.meter{position:relative;margin:25px 4px 10px;height:12px;border-radius:20px;background:linear-gradient(90deg,#a020f0 0%,#168cff 14.285%,#70d9ff 28.57%,#32d35b 42.85%,#9cff55 57.14%,#ffd21c 71.42%,#ff7b18 85.71%,#ff2020 100%)}
.marker{position:absolute;top:-38px;width:52px;height:32px;transform:translateX(-50%);pointer-events:none;z-index:3}.car{position:absolute;left:0;top:0;width:52px;height:14px;background-repeat:no-repeat;background-position:center;background-size:52px auto;background-color:transparent}.pointer{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.9))}
.labels{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.base{display:inline-block;margin-top:12px;padding:8px 12px;border-radius:8px;background:#5d1aa0;color:#fff;font-size:13px}
.description{color:#fff;font-size:20px;line-height:1.25;font-weight:800;margin-top:6px}.next{margin-top:16px;padding:14px;border-radius:10px;border:1px solid #333;background:#111}
@media(max-width:600px){.app{margin:0;border-radius:0;min-height:100vh}.tracks{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<section id="choose">
<h1>LMU Pace Checker</h1><div class="muted">Choose a circuit to check your GT3 pace.</div>
<input id="search" style="margin-top:20px" placeholder="Search tracks...">
<div id="tracks" class="tracks"></div>
</section>

<section id="checker" class="hidden">
<div class="top"><div><div class="muted" style="font-size:12px">TRACK</div><h1 id="name"></h1></div><button class="back" id="back">← Change track</button></div>
<div class="map"><img id="trackLogo" class="trackLogo hidden" alt="Circuit de Spa-Francorchamps logo"><svg id="trackSvg" viewBox="0 0 700 300"><path id="outline" class="outline"/></svg></div>
<div class="muted" style="font-size:12px;margin-bottom:7px">YOUR LAP TIME</div>
<div class="row"><input id="lap" placeholder="2:20.906" inputmode="decimal"><button class="check" id="go">Check pace</button></div>
<div class="muted" style="font-size:12px;margin-top:7px">Format: m:ss.xx or m:ss.xxx</div>
<div id="error" class="hidden" style="color:#ff9b9b;margin-top:7px;font-size:13px"></div>

<div id="result" class="result hidden">
<div class="muted" style="font-size:12px;letter-spacing:.08em">YOUR PACE</div>
<div id="pace" class="pace"></div>
<div id="description" class="description"></div>
<div class="meter"><div id="marker" class="marker"><div id="car" class="car" aria-hidden="true"></div><div class="pointer" aria-hidden="true"></div></div></div>
<div class="labels"><span>100%</span><span>101%</span><span>102%</span><span>103%</span><span>104%</span><span>105%</span><span>106%</span><span>107%</span></div>
<div id="base" class="base"></div>
<div id="next" class="next"></div>
</div>
</section>
</div>
